<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reel Clientes nas Lojas — Black Friday — Grupo Caldas Celulares</title>
<style>
  @font-face { font-family: "ID"; font-weight: 700; src: url(assets/fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: "ID"; font-weight: 800; src: url(assets/fonts/InterDisplay-ExtraBold.otf); }
  @font-face { font-family: "ID"; font-weight: 900; src: url(assets/fonts/InterDisplay-Black.otf); }
  @font-face { font-family: "ID"; font-weight: 800; font-style: italic; src: url(assets/fonts/InterDisplay-ExtraBoldItalic.otf); }
  @font-face { font-family: "ID"; font-weight: 900; font-style: italic; src: url(assets/fonts/InterDisplay-BlackItalic.otf); }

  :root { --red: #EF0000; --neon: #FF2626; --glow: rgba(255,30,30,.85); --ink: #0A0A0C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: "ID", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  .abs { position: absolute; will-change: transform, opacity; }

  /* every shot is a full-screen layer; the next one is revealed by a diagonal red stroke */
  .shot { inset: 0; overflow: hidden; background: #111; }
  .shot .bg { position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px); object-fit: cover; filter: blur(40px) brightness(.55) saturate(1.2); }
  .shot .fg { position: absolute; left: 0; width: 1080px; object-fit: cover; transform-origin: 50% 50%; }
  .shot .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  #stroke { top: -300px; width: 150px; height: 2520px; background: var(--red); box-shadow: 0 0 60px rgba(255,20,20,.7); z-index: 70; }
  #stroke2 { top: -300px; width: 34px; height: 2520px; background: #fff; z-index: 70; }

  #topShade { left: 0; right: 0; top: 0; height: 260px; background: linear-gradient(180deg, rgba(0,0,0,.55), transparent); z-index: 60; }
  #botShade { left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(0deg, rgba(0,0,0,.6), transparent); z-index: 60; }
  #topLogo { left: 50%; top: 64px; width: 440px; margin-left: -220px; z-index: 61; }
  #tag { left: 0; right: 0; bottom: 92px; text-align: center; font-weight: 900; font-style: italic; font-size: 52px; letter-spacing: -0.02em; z-index: 61; }
  #tag .o { color: transparent; -webkit-text-stroke: 2.5px var(--neon); filter: drop-shadow(0 0 6px var(--glow)); margin-right: 10px; }
  #tag .c { font-style: normal; font-weight: 800; font-size: 34px; margin-left: 14px; background: var(--red); padding: 6px 18px; border-radius: 999px; vertical-align: 8px; }

  /* hook */
  #hook { left: 60px; right: 60px; top: 1080px; z-index: 65; }
  #hook .chip { display: inline-block; background: #fff; color: var(--red); font-weight: 900; font-size: 32px; letter-spacing: .14em; padding: 12px 26px; border-radius: 999px; margin-bottom: 26px; transform-origin: 0 50%; }
  #hook h1 { font-weight: 900; font-size: 112px; line-height: .98; letter-spacing: -0.045em; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
  #hook h1 .ln { display: block; }
  #hook h1 .hl { position: relative; display: inline-block; padding: 0 14px; margin-left: -14px; }
  #hook h1 .hl i { position: absolute; inset: 10% 0 2% 0; background: var(--red); z-index: -1; transform-origin: 0 50%; transform: skewX(-8deg); border-radius: 6px; }
  #sticker { right: 60px; top: 330px; z-index: 65; background: #fff; color: var(--ink); font-weight: 900; font-size: 48px; padding: 18px 34px; border-radius: 22px;
    transform-origin: 50% 50%; box-shadow: 0 20px 40px -12px rgba(0,0,0,.6); }
  #sticker span { color: var(--red); }

  /* CTA */
  #cta { inset: 0; z-index: 80; background: radial-gradient(900px 800px at 50% 40%, rgba(239,0,0,.35), transparent 70%), var(--ink); }
  #ctaLogo { left: 50%; top: 340px; width: 820px; margin-left: -410px; }
  .slogan { position: absolute; width: 1000px; height: 560px; transform-origin: 50% 50%; }
  .slogan .multi { position: absolute; left: 40px; top: 0; font-weight: 900; font-style: italic; font-size: 236px; line-height: 1; letter-spacing: -0.02em; color: transparent; -webkit-text-stroke: 7px var(--neon); filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 28px rgba(255,0,0,.6)); }
  .slogan .friday { position: absolute; left: 20px; top: 205px; font-weight: 900; font-style: italic; font-size: 214px; line-height: 1; letter-spacing: -0.035em; color: #fff; filter: drop-shadow(0 0 16px rgba(255,255,255,.35)); }
  .slogan .ring { position: absolute; left: 700px; top: 285px; width: 150px; height: 150px; border-radius: 50%; border: 18px solid var(--neon); box-shadow: 0 0 22px var(--glow), inset 0 0 18px var(--glow); }
  .slogan .s1, .slogan .s2 { position: absolute; border: 7px solid var(--neon); border-radius: 12px; box-shadow: 0 0 20px var(--glow), inset 0 0 12px var(--glow); }
  .slogan .s1 { left: 862px; top: 90px; width: 50px; height: 200px; transform: rotate(40deg); }
  .slogan .s2 { left: 880px; top: 337px; width: 175px; height: 50px; }
  .slogan .pill { position: absolute; left: 30px; top: 432px; padding: 10px 56px 18px; border-radius: 999px; border: 7px solid var(--neon); background: rgba(10,10,12,.55); box-shadow: 0 0 24px var(--glow), inset 0 0 16px rgba(255,30,30,.6); font-weight: 800; font-size: 82px; letter-spacing: -0.02em; color: #fff; white-space: nowrap; }
  #ctaSlogan { left: 30px; top: 640px; }
  #ctaMsg { left: 60px; right: 60px; top: 1240px; text-align: center; font-weight: 900; font-size: 84px; line-height: 1.05; letter-spacing: -0.04em; }
  #ctaMsg .l { display: block; }
  #ctaMsg .r { color: var(--neon); text-shadow: 0 0 24px rgba(255,20,20,.65); }
</style>
</head>
<body>
<div id="stage">
  <div id="shots"></div>
  <div id="stroke" class="abs"></div><div id="stroke2" class="abs"></div>
  <div id="topShade" class="abs"></div><div id="botShade" class="abs"></div>
  <img id="topLogo" class="abs" src="assets/logo-caldas-branca.png" alt="Grupo Caldas Celulares">
  <div id="tag" class="abs"><span class="o">MULTI</span>Friday<span class="c">Claro que tem</span></div>

  <div id="hook" class="abs">
    <div class="chip">NAS NOSSAS LOJAS</div>
    <h1><span class="ln">Olha quem</span><span class="ln">aproveitou a</span><span class="ln"><span class="hl"><i></i>Black Friday</span></span><span class="ln">com a gente!</span></h1>
  </div>
  <div id="sticker" class="abs">Loja <span>cheia!</span></div>

  <div id="cta" class="abs">
    <img id="ctaLogo" class="abs" src="assets/logo-caldas-branca.png" alt="Grupo Caldas Celulares">
    <div id="ctaSlogan" class="slogan"></div>
    <div id="ctaMsg" class="abs"><span class="l">Obrigado a todos</span><span class="l">que aproveitaram</span><span class="l r">com a gente!</span></div>
  </div>
</div>

<script>
/* ---------------- content & timeline ---------------- */
const FPS = 30;
const CLIP_FRAMES = { fachada: 96, entrada: 72, interna: 72 };
const PHOTOS = Array.from({ length: 13 }, (_, i) => `assets/fotos/cliente-${String(i + 1).padStart(2, "0")}.jpg`);
const SHOTS = [
  { clip: "fachada", dur: 3.0 },
  { clip: "entrada", dur: 2.2 },
  { clip: "interna", dur: 2.2 },
  ...PHOTOS.map(src => ({ photo: src, dur: 1.6 })),
];
const WIPE = 0.42;                         // stroke wipe duration (centred on each cut)
let acc = 0;
SHOTS.forEach(s => { s.start = acc; s.end = acc + s.dur; acc += s.dur; });
const CTA_START = acc;
const DUR = +(CTA_START + 4.6).toFixed(2);

/* ---------------- helpers ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const $ = s => document.querySelector(s);
const set = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };
const vis = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };
const flicker = (t, t0, len = 0.45) => { if (t < t0) return 0; const x = (t - t0) / len; return x >= 1 ? 1 : [1, .15, 1, .3, .9, .2, 1, 1][Math.floor(x * 8)]; };

function showFrame(img, clip, n) {
  n = Math.max(1, Math.min(CLIP_FRAMES[clip], n));
  const src = `assets/clips/${clip}/f${String(n).padStart(4, "0")}.jpg`;
  if (img.dataset.src === src) return Promise.resolve();
  img.dataset.src = src; img.src = src;
  return img.decode().catch(() => {});
}

/* ---------------- build ---------------- */
SHOTS.forEach((s, i) => {
  const d = document.createElement("div");
  d.className = "shot abs";
  d.style.zIndex = 10 + i;
  if (s.clip) d.innerHTML = `<img class="full">`;
  else d.innerHTML = `<img class="bg" src="${s.photo}"><img class="fg" src="${s.photo}">`;
  $("#shots").appendChild(d);
  s.el = d; s.img = d.querySelector(".full"); s.fg = d.querySelector(".fg");
});
// fit photos: full width, natural aspect, vertically centred (blurred copy fills the rest)
function layoutPhotos() {
  SHOTS.filter(s => s.fg).forEach(s => {
    const ar = s.fg.naturalHeight / s.fg.naturalWidth;
    let w = 1080, h = 1080 * ar;
    if (h > 1460) { h = 1460; w = h / ar; }                 // keep logo + tag on the blurred area
    s.fg.style.width = w + "px"; s.fg.style.height = h + "px";
    s.fg.style.left = (1080 - w) / 2 + "px"; s.fg.style.top = (1920 - h) / 2 + "px";
    if (w < 1080) { s.fg.style.borderRadius = "28px"; s.fg.style.boxShadow = "0 30px 70px -20px rgba(0,0,0,.8)"; }
  });
}
$("#ctaSlogan").innerHTML = `<div class="multi">MULTI</div><div class="s1"></div><div class="friday">Friday</div><div class="ring"></div><div class="s2"></div><div class="pill">Claro que tem</div>`;
const ctaParts = ["multi", "s1", "friday", "ring", "s2", "pill"].map(c => $("#ctaSlogan ." + c));

/* ---------------- sound cues (kept to the essentials) ---------------- */
window.SFX_EVENTS = [
  { type: "impact", t: 0.05 },               // opening
  { type: "whoosh", t: SHOTS[3].start - 0.3 },// into the customer photos
  { type: "impact", t: CTA_START },          // closing
];

/* ---------------- render ---------------- */
const SKEW = 0.32;                          // diagonal slope of the wipe (dx per dy)
window.render = async function (t) {
  const waits = [];
  // which shot is incoming (wipe in progress)?
  let wipe = null;
  SHOTS.forEach((s, i) => {
    const incomingWipe = i > 0 && t >= s.start - WIPE / 2 && t < s.start + WIPE / 2;
    const on = (t >= s.start - WIPE / 2 && t < s.end + WIPE / 2) && t < CTA_START + 0.4;
    vis(s.el, on);
    if (!on) return;
    if (incomingWipe) {
      const p = easeInOut(prog(t, s.start - WIPE / 2, s.start + WIPE / 2));
      const X = lerp(-700, 1080 + 700, p);                 // stroke centre at mid-height
      const top = X + 960 * SKEW, bot = X - 960 * SKEW;
      s.el.style.clipPath = `polygon(0 0, ${top}px 0, ${bot}px 1920px, 0 1920px)`;
      wipe = X;
    } else s.el.style.clipPath = "none";
    const local = t - s.start;
    if (s.clip) {
      waits.push(showFrame(s.img, s.clip, Math.floor(Math.max(0, local) * FPS) + 1));
      s.img.style.transform = `scale(${1.04 + 0.02 * prog(t, s.start, s.end)})`;
    } else {
      const kb = prog(t, s.start - WIPE / 2, s.end + WIPE / 2);
      const dir = SHOTS.indexOf(s) % 2 ? 1 : -1;
      s.fg.style.transform = `scale(${lerp(1.08, 1.0, easeOutCubic(kb))}) translateX(${dir * lerp(12, -12, kb)}px)`;
    }
  });
  // red + white stroke riding the wipe edge
  const showStroke = wipe !== null;
  vis($("#stroke"), showStroke); vis($("#stroke2"), showStroke);
  if (showStroke) {
    const ang = Math.atan(SKEW) * 180 / Math.PI;
    $("#stroke").style.left = (wipe - 75) + "px";
    $("#stroke").style.transform = `skewX(${-ang}deg)`;
    $("#stroke2").style.left = (wipe - 130) + "px";
    $("#stroke2").style.transform = `skewX(${-ang}deg)`;
  }

  // chrome
  const ctaOut = 1 - prog(t, CTA_START - 0.1, CTA_START + 0.2);
  set($("#topLogo"), easeOutCubic(prog(t, 0, 0.4)) * ctaOut);
  ["#topShade", "#botShade"].forEach(s => { $(s).style.opacity = ctaOut; });
  const tg = easeOutCubic(prog(t, SHOTS[3].start, SHOTS[3].start + 0.4)) * ctaOut;
  set($("#tag"), tg, `translateY(${lerp(30, 0, tg)}px)`);

  // hook text over the storefront
  {
    const out = easeInOut(prog(t, SHOTS[0].end - 0.35, SHOTS[0].end));
    const h = $("#hook"); vis(h, t < SHOTS[0].end + 0.05);
    const c = easeOutBack(prog(t, 0.1, 0.4), 1.8);
    set(h.querySelector(".chip"), clamp(c * 1.5) * (1 - out), `scale(${lerp(.5, 1, c)})`);
    h.querySelectorAll(".ln").forEach((l, i) => {
      const x = easeOutExpo(prog(t, 0.25 + i * 0.16, 0.7 + i * 0.16));
      set(l, x * (1 - out), `translateY(${lerp(60, 0, x) - 80 * out}px)`);
    });
    h.querySelector(".hl i").style.transform = `skewX(-8deg) scaleX(${easeOutExpo(prog(t, 0.85, 1.25))})`;
  }
  // "Loja cheia!" sticker on the in-store clips
  {
    const a = SHOTS[1].start, b = SHOTS[2].end;
    const on = t > a && t < b + 0.1; vis($("#sticker"), on);
    const x = easeOutBack(prog(t, a + 0.25, a + 0.6), 1.8), o = 1 - prog(t, b - 0.3, b);
    set($("#sticker"), clamp(x * 1.4) * o, `rotate(-6deg) scale(${lerp(.4, 1, x)})`);
  }

  // CTA
  {
    const T = CTA_START, on = t >= T - WIPE / 2; vis($("#cta"), on);
    if (on) {
      const p = easeInOut(prog(t, T - WIPE / 2, T + WIPE / 2));
      const X = lerp(-700, 1780, p);
      $("#cta").style.clipPath = p < 1 ? `polygon(0 0, ${X + 960 * SKEW}px 0, ${X - 960 * SKEW}px 1920px, 0 1920px)` : "none";
      if (p < 1) { vis($("#stroke"), true); vis($("#stroke2"), true); const ang = Math.atan(SKEW) * 180 / Math.PI;
        $("#stroke").style.left = (X - 75) + "px"; $("#stroke").style.transform = `skewX(${-ang}deg)`;
        $("#stroke2").style.left = (X - 130) + "px"; $("#stroke2").style.transform = `skewX(${-ang}deg)`;
        $("#stroke").style.zIndex = 90; $("#stroke2").style.zIndex = 90; }
      const lg = easeOutBack(prog(t, T + 0.2, T + 0.75), 1.2);
      set($("#ctaLogo"), clamp(lg * 1.3), `translateY(${lerp(-50, 0, lg)}px) scale(${lerp(.9, 1, lg)})`);
      const t0 = T + 0.5, [multi, s1, friday, ring, s2, pill] = ctaParts;
      const fr = easeOutExpo(prog(t, t0 + 0.2, t0 + 0.6)), pl = easeOutBack(prog(t, t0 + 0.45, t0 + 0.85), 1.6);
      multi.style.opacity = flicker(t, t0, 0.45);
      set(friday, fr, `translateX(${lerp(-80, 0, fr)}px)`);
      [ring, s1, s2].forEach((el, i) => { el.style.opacity = flicker(t, t0 + 0.4 + i * 0.1, 0.3); });
      set(pill, clamp(pl * 1.3), `scale(${lerp(.6, 1, pl)})`);
      $("#ctaSlogan").style.transform = "scale(.8)";
      document.querySelectorAll("#ctaMsg .l").forEach((l, i) => {
        const x = easeOutCubic(prog(t, T + 1.5 + i * 0.18, T + 1.95 + i * 0.18));
        set(l, x, `translateY(${lerp(40, 0, x)}px)`);
      });
    }
  }
  await Promise.all(waits);
};

window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })),
]).then(() => Promise.all([document.fonts.load('900 100px "ID"'), document.fonts.load('italic 900 100px "ID"')]))
  .then(() => { layoutPhotos(); return render(0); });
</script>
</body>
</html>
