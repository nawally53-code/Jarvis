<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reel Novidades em Acessórios — Grupo Caldas Celulares</title>
<style>
  @font-face { font-family: "ID"; font-weight: 600; src: url(assets/fonts/InterDisplay-SemiBold.otf); }
  @font-face { font-family: "ID"; font-weight: 700; src: url(assets/fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: "ID"; font-weight: 800; src: url(assets/fonts/InterDisplay-ExtraBold.otf); }
  @font-face { font-family: "ID"; font-weight: 900; src: url(assets/fonts/InterDisplay-Black.otf); }
  @font-face { font-family: "ID"; font-weight: 900; font-style: italic; src: url(assets/fonts/InterDisplay-BlackItalic.otf); }

  :root { --red: #E30613; --red2: #EF0000; --ink: #141416; --paper: #F4F0ED; --muted: #7C7270; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  body { font-family: "ID", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(1000px 900px at 50% 40%, #FFFFFF 0%, var(--paper) 60%, #ECE4DF 100%); }
  .abs { position: absolute; will-change: transform, opacity; }
  .ray { position: absolute; background: var(--red2); border-radius: 12px; transform-origin: 50% 100%; }

  #topLogo { left: 50%; top: 70px; width: 420px; margin-left: -210px; z-index: 40; }

  /* ---------- HOOK: clean title ---------- */
  #hTitle { left: 0; right: 0; top: 740px; text-align: center; font-weight: 900; font-size: 150px; line-height: .98; letter-spacing: -0.05em; }
  #hTitle .l { display: block; }
  #hTitle .r { color: var(--red); }
  #hRule { left: 50%; top: 1080px; width: 180px; height: 12px; margin-left: -90px; border-radius: 6px; background: var(--red); transform-origin: 50% 50%; }

  /* ---------- PRODUCT SCENES ---------- */
  #card { left: 130px; top: 228px; width: 820px; height: 1458px; border-radius: 56px; overflow: hidden; background: #222;
    box-shadow: 0 50px 90px -30px rgba(60,20,20,.55), 0 0 0 8px #fff; transform-origin: 50% 50%; }
  #card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #card .shade { position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent); }
  #bars { position: absolute; left: 34px; right: 34px; top: 30px; display: flex; gap: 12px; }
  #bars i { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); overflow: hidden; display: block; }
  #bars i b { display: block; height: 100%; width: 100%; background: #fff; transform-origin: 0 50%; }
  #cardNum { position: absolute; left: 36px; top: 58px; font-weight: 900; font-size: 34px; color: #fff; letter-spacing: .08em; text-shadow: 0 2px 10px rgba(0,0,0,.4); }

  .tag { display: inline-flex; align-items: center; gap: 18px; background: #fff; color: var(--ink); font-weight: 800; font-size: 42px; letter-spacing: -0.015em;
    padding: 22px 34px 22px 24px; border-radius: 999px; white-space: nowrap; z-index: 30;
    box-shadow: 0 24px 50px -16px rgba(40,10,10,.5), 0 0 0 3px rgba(227,6,19,.12); }
  .tag i { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--red); display: block; flex: none; }
  .tag i::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid rgba(227,6,19,.35); }

  #name { left: 0; right: 0; top: 1716px; text-align: center; }
  #name .n { font-weight: 900; font-size: 62px; letter-spacing: -0.03em; }
  #name .n span { color: var(--red); }
  #name .s { font-weight: 700; font-size: 34px; color: var(--muted); margin-top: 6px; }

  /* ---------- CHAPTER CARDS ---------- */
  .chapter { inset: 0; background: var(--red); color: #fff; z-index: 80; overflow: hidden; }
  .chapter .num { position: absolute; left: 40px; top: 300px; font-weight: 900; font-style: italic; font-size: 640px; line-height: 1; letter-spacing: -0.06em;
    color: transparent; -webkit-text-stroke: 6px rgba(255,255,255,.9); }
  .chapter .lbl { position: absolute; left: 80px; top: 1080px; font-weight: 800; font-size: 36px; letter-spacing: .18em; opacity: .85; }
  .chapter .nm { position: absolute; left: 76px; right: 60px; top: 1140px; font-weight: 900; font-size: 128px; line-height: .96; letter-spacing: -0.045em; }
  .chapter .sb { position: absolute; left: 80px; top: 1440px; font-weight: 700; font-size: 48px; background: #fff; color: var(--red); padding: 12px 30px; border-radius: 999px; }

  /* ---------- CTA ---------- */
  #cta { inset: 0; }
  #ctaLogo { left: 50%; top: 520px; width: 880px; margin-left: -440px; }
  #ctaRule { left: 50%; top: 860px; width: 160px; height: 12px; margin-left: -80px; border-radius: 6px; background: var(--red); }
  #ctaKick { left: 0; right: 0; top: 930px; text-align: center; font-weight: 800; font-size: 40px; letter-spacing: .16em; color: var(--red); }
  #ctaMsg { left: 60px; right: 60px; top: 1000px; text-align: center; font-weight: 900; font-size: 96px; line-height: 1.04; letter-spacing: -0.04em; }
  #ctaMsg .l { display: block; }
  #ctaMsg .r { color: var(--red); }
</style>
</head>
<body>
<div id="stage">
  <div id="rays"></div>
  <img id="topLogo" class="abs" src="assets/logo-caldas.png" alt="Grupo Caldas Celulares">

  <!-- HOOK -->
  <div id="hook" class="abs" style="inset:0">
    <div id="hTitle" class="abs"><span class="l">Novidades em</span><span class="l r">acessórios</span></div>
    <div id="hRule" class="abs"></div>
  </div>

  <!-- PRODUCT SCENES -->
  <div id="scene" class="abs" style="inset:0">
    <div id="card" class="abs"><img id="clip"><div class="shade"></div>
      <div id="bars"><i><b></b></i><i><b></b></i></div><div id="cardNum">01 / 02</div></div>
    <div id="name" class="abs"><div class="n"></div><div class="s"></div></div>
    <div id="tags"></div>
  </div>

  <!-- CTA -->
  <div id="cta" class="abs">
    <img id="ctaLogo" class="abs" src="assets/logo-caldas.png" alt="Grupo Caldas Celulares">
    <div id="ctaRule" class="abs"></div>
    <div id="ctaKick" class="abs">NOVIDADES EM ACESSÓRIOS</div>
    <div id="ctaMsg" class="abs"><span class="l">Venha até uma de</span><span class="l">nossas lojas</span><span class="l r">e confira!</span></div>
  </div>
</div>

<script>
/* ---------------- content & timeline (seconds) ---------------- */
const FPS = 30;
const CLIP_FRAMES = { h1: 84, h2: 84, h3: 84, h4: 84, a1: 180, a2: 90, b1: 107, b2: 242 };
const HOOK_END = 2.6;
const SWITCH = 11.9;                                               // soft change from product 1 to product 2
const SCENES = [                                                   // clips shown in the big card
  { clip: "a1", start: 2.9, prod: 0 }, { clip: "a2", start: 8.9, prod: 0 },
  { clip: "b1", start: SWITCH, prod: 1 }, { clip: "b2", start: SWITCH + 107 / FPS, prod: 1 },
];
const PRODUCTS = [
  { n: 'DEVIA <span>Sound Lite 3</span>', s: "Caixa de som magnética", from: 2.9, to: SWITCH },
  { n: 'DEVIA <span>Ultra Watch</span>', s: "Smartwatch", from: SWITCH, to: 0 },
];
const B2 = SCENES[3].start;
const TAGS = [            // [time, text, side, y]
  [3.4, "Magnética: gruda no celular", "L", 420],
  [5.4, "Som de alto desempenho", "R", 980],
  [7.2, "Design compacto", "L", 1300],
  [9.3, "Disponível nas nossas lojas", "R", 1420],
  [B2 + 0.5, "Atividade e frequência cardíaca", "R", 380],
  [B2 + 2.5, "Monitor de sono", "L", 1180],
  [B2 + 4.8, "Controle de música", "R", 1320],
  [B2 + 7.0, "Chamadas no pulso", "L", 1380],
];
const CTA_START = B2 + 242 / FPS - 0.05;
const DUR = +(CTA_START + 4.9).toFixed(2);
PRODUCTS[1].to = CTA_START;

/* ---------------- helpers ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const $ = s => document.querySelector(s);
const set = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };
const vis = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };

// show frame n of a clip in an <img>; resolves once the frame is decoded
function showFrame(img, clip, n) {
  n = Math.max(1, Math.min(CLIP_FRAMES[clip], n));
  const src = `assets/clips/${clip}/f${String(n).padStart(4, "0")}.jpg`;
  if (img.dataset.src === src) return Promise.resolve();
  img.dataset.src = src;
  img.src = src;
  return img.decode().catch(() => {});
}
const frameAt = (t, start) => Math.floor((t - start) * FPS) + 1;

/* ---------------- build ---------------- */
const tags = TAGS.map(([t0, txt, side, y], i) => {
  const d = document.createElement("div");
  d.className = "tag abs";
  d.innerHTML = `<i></i>${txt}`;
  d.style.top = y + "px";
  d.style[side === "L" ? "left" : "right"] = "46px";
  $("#tags").appendChild(d);
  const next = TAGS[i + 1] ? TAGS[i + 1][0] : CTA_START;
  let t1 = Math.min(next, t0 + 3.2);
  if (t0 < SWITCH) t1 = Math.min(t1, SWITCH - 0.3);          // leave before the product switch
  return { el: d, t0, t1, side };
});
const RAYS = [[960, 120, 22, 90, 38, 0], [1020, 190, 22, 64, 70, .08], [905, 92, 22, 58, 8, .04],
              [100, 1760, 22, 90, -140, .12], [44, 1680, 22, 64, -110, .16], [160, 1830, 22, 56, -170, .2]];
const rays = RAYS.map(([x, y, w, h, a, d]) => {
  const r = document.createElement("div");
  r.className = "ray";
  Object.assign(r.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  $("#rays").appendChild(r);
  return { el: r, a, d };
});

/* ---------------- sound cues ---------------- */
const ev = [{ type: "impact", t: 0.1 }, { type: "marker", t: 0.75 }, { type: "whoosh", t: HOOK_END - 0.35 },
            { type: "whoosh", t: SWITCH - 0.3 }, { type: "chime", t: SWITCH + 0.05 }];
TAGS.forEach(([t0]) => ev.push({ type: "pop2", t: t0 }));
ev.push({ type: "whoosh", t: CTA_START - 0.3 }, { type: "chime", t: CTA_START + 0.9 }, { type: "chime", t: CTA_START + 2.2 });
window.SFX_EVENTS = ev.sort((a, b) => a.t - b.t);

/* ---------------- render(t) — async: waits for video frames to decode ---------------- */
window.render = async function (t) {
  const waits = [];
  rays.forEach(({ el, a, d }) => {
    const v = easeOutBack(prog(t, 0.1 + d, 0.6 + d));
    set(el, clamp(v), `rotate(${a}deg) scaleY(${Math.max(0, v) * (1 + 0.06 * Math.sin(t * 3 + d * 20))})`);
  });
  const ctaOut = 1 - prog(t, CTA_START - 0.1, CTA_START + 0.2);
  set($("#topLogo"), easeOutCubic(prog(t, 0, 0.4)) * ctaOut);

  /* hook */
  const hookOn = t < HOOK_END + 0.3;
  vis($("#hook"), hookOn);
  if (hookOn) {
    const out = easeInOut(prog(t, HOOK_END - 0.3, HOOK_END + 0.2));
    document.querySelectorAll("#hTitle .l").forEach((l, i) => {
      const x = easeOutExpo(prog(t, 0.1 + i * 0.2, 0.7 + i * 0.2));
      set(l, x * (1 - out), `translateY(${lerp(60, 0, x) - 120 * out}px)`);
    });
    const r = easeOutExpo(prog(t, 0.7, 1.2));
    set($("#hRule"), r * (1 - out), `scaleX(${r}) translateY(${-120 * out}px)`);
  }

  /* product scenes */
  const sceneOn = t >= HOOK_END - 0.2 && t < CTA_START + 0.3;
  vis($("#scene"), sceneOn);
  if (sceneOn) {
    const sc = [...SCENES].reverse().find(s => t >= s.start) || SCENES[0];
    waits.push(showFrame($("#clip"), sc.clip, frameAt(t, sc.start)));
    // card entrance after each chapter card + exit to CTA
    const ent = easeOutCubic(prog(t, HOOK_END - 0.2, HOOK_END + 0.4));
    const out = easeInOut(prog(t, CTA_START - 0.2, CTA_START + 0.3));
    // soft product switch: brief dip (scale + fade) around SWITCH
    const dip = Math.sin(Math.PI * prog(t, SWITCH - 0.25, SWITCH + 0.25));
    set($("#card"), (1 - out) * ent * (1 - 0.85 * dip), `translateY(${lerp(140, 0, ent) - 200 * out}px) scale(${lerp(.94, 1, ent) * (1 - 0.1 * out) * (1 - 0.05 * dip)})`);
    // story bars + counter
    const prod = sc.prod;
    $("#cardNum").textContent = `0${prod + 1} / 02`;
    document.querySelectorAll("#bars b").forEach((b, i) => {
      const p = PRODUCTS[i];
      b.style.transform = `scaleX(${i < prod ? 1 : i > prod ? 0 : prog(t, p.from, p.to)})`;
    });
    // product name below the card
    const P = PRODUCTS[prod];
    const nm = $("#name");
    if (nm.dataset.p !== String(prod)) { nm.dataset.p = prod; nm.querySelector(".n").innerHTML = P.n; nm.querySelector(".s").textContent = P.s; }
    const ni = prod === 0 ? easeOutCubic(prog(t, HOOK_END, HOOK_END + 0.4)) * (1 - prog(t, SWITCH - 0.25, SWITCH)) : easeOutCubic(prog(t, SWITCH, SWITCH + 0.35));
    set(nm, ni * (1 - out), `translateY(${lerp(40, 0, ni)}px)`);
    // feature tags
    tags.forEach(g => {
      const on = t >= g.t0 && t < g.t1 + 0.3;
      g.el.style.visibility = on ? "inherit" : "hidden";
      if (!on) return;
      const a = easeOutBack(prog(t, g.t0, g.t0 + 0.4), 1.5), b = easeInOut(prog(t, g.t1 - 0.05, g.t1 + 0.25));
      const dx = (g.side === "L" ? -1 : 1) * 420;
      set(g.el, clamp(a * 1.4) * (1 - b), `translateX(${lerp(dx, 0, a) + dx * 0.4 * b}px) scale(${lerp(.8, 1, a)})`);
      g.el.querySelector("i").style.transform = `scale(${1 + 0.15 * Math.sin(t * 8)})`;
    });
  }

  /* CTA */
  const T = CTA_START;
  const ctaOn = t >= T;
  vis($("#cta"), ctaOn);
  if (ctaOn) {
    const lg = easeOutBack(prog(t, T + 0.1, T + 0.7), 1.2);
    set($("#ctaLogo"), clamp(lg * 1.3), `translateY(${lerp(-50, 0, lg)}px) scale(${lerp(.9, 1, lg)})`);
    const ru = easeOutExpo(prog(t, T + 0.6, T + 1.0));
    set($("#ctaRule"), ru, `scaleX(${ru})`);
    set($("#ctaKick"), easeOutCubic(prog(t, T + 0.7, T + 1.0)));
    document.querySelectorAll("#ctaMsg .l").forEach((l, i) => {
      const x = easeOutCubic(prog(t, T + 0.85 + i * 0.18, T + 1.3 + i * 0.18));
      set(l, x, `translateY(${lerp(40, 0, x)}px)`);
    });
  }
  await Promise.all(waits);
};

window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })),
]).then(() => Promise.all([document.fonts.load('900 100px "ID"'), document.fonts.load('italic 900 100px "ID"')]))
  .then(() => render(0));
</script>
</body>
</html>
