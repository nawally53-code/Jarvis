<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reel Galaxy S26 Ultra — Cliente — Grupo Caldas Celulares</title>
<style>
  @font-face { font-family: "ID"; font-weight: 600; src: url(assets/fonts/InterDisplay-SemiBold.otf); }
  @font-face { font-family: "ID"; font-weight: 700; src: url(assets/fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: "ID"; font-weight: 800; src: url(assets/fonts/InterDisplay-ExtraBold.otf); }
  @font-face { font-family: "ID"; font-weight: 900; src: url(assets/fonts/InterDisplay-Black.otf); }
  :root { --red: #EF0000; --neon: #FF2626; --ink: #0A0A0C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: "ID", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  .abs { position: absolute; will-change: transform, opacity; }
  #clip { inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 55%; }
  #topShade { left: 0; right: 0; top: 0; height: 720px; background: linear-gradient(180deg, rgba(0,0,0,.78), rgba(0,0,0,.35) 60%, transparent); }
  #botShade { left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(0deg, rgba(0,0,0,.75), transparent); }
  #topLogo { left: 50%; top: 64px; width: 420px; margin-left: -210px; }

  #hook { left: 70px; right: 70px; top: 250px; text-align: center; }
  #hook .chip { display: inline-flex; align-items: center; gap: 12px; background: var(--red); font-weight: 900; font-size: 30px; letter-spacing: .16em; padding: 12px 26px; border-radius: 999px; }
  #hook .chip i { width: 14px; height: 14px; border-radius: 50%; background: #fff; display: block; }
  #hook .a { font-weight: 800; font-size: 66px; letter-spacing: -0.03em; margin-top: 26px; line-height: 1.04; }
  #hook .b { font-weight: 900; font-size: 116px; letter-spacing: -0.05em; line-height: .95; margin-top: 10px; }
  #hook .b span { color: var(--neon); }

  #card { left: 60px; right: 60px; bottom: 120px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 30px 36px; border-radius: 34px; background: rgba(15,15,18,.62); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 2px solid rgba(255,255,255,.18); box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
  #card .n small { display: block; font-weight: 700; font-size: 30px; color: #cfc6c6; letter-spacing: .02em; }
  #card .n b { font-weight: 900; font-size: 62px; letter-spacing: -0.03em; }
  #card .gb { flex: none; background: var(--red); font-weight: 900; font-size: 48px; padding: 14px 28px; border-radius: 22px; }

  #specs { right: 60px; top: 300px; display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
  #specs div { display: inline-flex; align-items: center; gap: 14px; background: #fff; color: var(--ink); font-weight: 800; font-size: 40px; padding: 18px 30px 18px 22px; border-radius: 999px;
    box-shadow: 0 20px 40px -14px rgba(0,0,0,.6); }
  #specs div i { width: 22px; height: 22px; border-radius: 50%; background: var(--red); display: block; }

  #hero { left: 0; right: 0; top: 250px; text-align: center; }
  #hero .k { font-weight: 800; font-size: 40px; letter-spacing: .18em; color: var(--neon); }
  #hero .n { font-weight: 900; font-size: 128px; letter-spacing: -0.05em; line-height: .95; margin-top: 12px; }
  #hero .g { display: inline-block; margin-top: 22px; background: #fff; color: var(--red); font-weight: 900; font-size: 64px; padding: 10px 40px; border-radius: 999px; }

  #cta { inset: 0; background: radial-gradient(900px 800px at 50% 42%, rgba(239,0,0,.35), transparent 70%), var(--ink); }
  #ctaLogo { left: 50%; top: 560px; width: 860px; margin-left: -430px; }
  #ctaRule { left: 50%; top: 900px; width: 160px; height: 12px; margin-left: -80px; border-radius: 6px; background: var(--neon); }
  #ctaK { left: 0; right: 0; top: 970px; text-align: center; font-weight: 800; font-size: 38px; letter-spacing: .16em; color: var(--neon); }
  #ctaMsg { left: 60px; right: 60px; top: 1040px; text-align: center; font-weight: 900; font-size: 90px; line-height: 1.05; letter-spacing: -0.04em; }
  #ctaMsg .l { display: block; }
  #ctaMsg .r { color: var(--neon); }
  #flash { inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="stage">
  <img id="clip" class="abs">
  <div id="topShade" class="abs"></div><div id="botShade" class="abs"></div>
  <img id="topLogo" class="abs" src="assets/logo-caldas-branca.png" alt="Grupo Caldas Celulares">

  <div id="hook" class="abs">
    <div class="chip"><i></i>UNBOXING NA LOJA</div>
    <div class="a">Mais um cliente saiu de</div>
    <div class="b">Galaxy <span>S26 Ultra</span></div>
  </div>
  <div id="specs" class="abs">
    <div><i></i>256GB</div>
    <div><i></i>Câmera de 200MP</div>
    <div><i></i>S Pen integrada</div>
  </div>
  <div id="hero" class="abs">
    <div class="k">SAMSUNG</div>
    <div class="n">Galaxy<br>S26 Ultra</div>
    <div class="g">256GB</div>
  </div>
  <div id="card" class="abs"><div class="n"><small>Samsung</small><b>Galaxy S26 Ultra</b></div><div class="gb">256GB</div></div>

  <div id="cta" class="abs">
    <img id="ctaLogo" class="abs" src="assets/logo-caldas-branca.png" alt="Grupo Caldas Celulares">
    <div id="ctaRule" class="abs"></div>
    <div id="ctaK" class="abs">GALAXY S26 ULTRA</div>
    <div id="ctaMsg" class="abs"><span class="l">Venha até uma de</span><span class="l">nossas lojas e</span><span class="l r">garanta o seu!</span></div>
  </div>
  <div id="flash" class="abs"></div>
</div>
<script>
const FPS = 30, FRAMES = 526, CLIP_END = FRAMES / FPS;       // 17.53 s
const HOOK_END = 2.9, SPEC = [7.4, 8.6, 9.8], SPEC_END = 14.4, HERO = 15.1;   // HERO = cut point in the edited clip (flash hides the jump)
const CTA_START = CLIP_END, DUR = +(CTA_START + 4.4).toFixed(2);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const $ = s => document.querySelector(s);
const set = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };
const vis = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };

function showFrame(n) {
  n = Math.max(1, Math.min(FRAMES, n));
  const img = $("#clip"), src = `assets/clip/f${String(n).padStart(4, "0")}.jpg`;
  if (img.dataset.src === src) return Promise.resolve();
  img.dataset.src = src; img.src = src;
  return img.decode().catch(() => {});
}

window.SFX_EVENTS = [
  { type: "pop", t: 0.15 },
  { type: "chime", t: HERO + 0.1 },          // phone revealed
  { type: "impact", t: CTA_START },
];

window.render = async function (t) {
  const w = showFrame(Math.floor(t * FPS) + 1);
  const ctaOut = 1 - prog(t, CTA_START - 0.1, CTA_START + 0.2);
  $("#clip").style.transform = `scale(${1.03 + 0.03 * prog(t, HERO, CLIP_END)})`;
  ["#topShade", "#botShade"].forEach(s => { $(s).style.opacity = ctaOut; });
  set($("#topLogo"), easeOutCubic(prog(t, 0, 0.4)) * ctaOut);

  // hook
  {
    const out = easeInOut(prog(t, HOOK_END - 0.3, HOOK_END)); vis($("#hook"), t < HOOK_END + 0.05);
    const c = easeOutBack(prog(t, 0.1, 0.4), 1.8);
    set($("#hook .chip"), clamp(c * 1.5) * (1 - out), `scale(${lerp(.5, 1, c)})`);
    $("#hook .chip i").style.opacity = Math.sin(t * 9) > 0 ? 1 : .35;
    const a = easeOutExpo(prog(t, 0.3, 0.75)), b = easeOutBack(prog(t, 0.55, 1.0), 1.3);
    set($("#hook .a"), a * (1 - out), `translateY(${lerp(40, 0, a) - 60 * out}px)`);
    set($("#hook .b"), clamp(b * 1.4) * (1 - out), `translateY(${-60 * out}px) scale(${lerp(.8, 1, b)})`);
  }
  // spec chips during the reveal
  vis($("#specs"), t > SPEC[0] && t < SPEC_END + 0.4);
  [...document.querySelectorAll("#specs div")].forEach((d, i) => {
    const x = easeOutBack(prog(t, SPEC[i], SPEC[i] + 0.4), 1.5), o = 1 - easeInOut(prog(t, SPEC_END - 0.1 + i * 0.08, SPEC_END + 0.25 + i * 0.08));
    set(d, clamp(x * 1.4) * o, `translateX(${lerp(420, 0, x) + 420 * (1 - o)}px)`);
  });
  // bottom product card (from after the hook until the hero shot)
  {
    const on = t > HOOK_END - 0.1 && t < HERO + 0.4; vis($("#card"), on);
    const x = easeOutCubic(prog(t, HOOK_END, HOOK_END + 0.45)), o = 1 - easeInOut(prog(t, HERO - 0.3, HERO));
    set($("#card"), x * o, `translateY(${lerp(80, 0, x) + 80 * (1 - o)}px)`);
  }
  // hero: phone in the box, big name
  {
    const on = t > HERO - 0.05 && t < CTA_START + 0.3; vis($("#hero"), on);
    const k = easeOutCubic(prog(t, HERO, HERO + 0.35)), n = easeOutBack(prog(t, HERO + 0.15, HERO + 0.6), 1.3), g = easeOutBack(prog(t, HERO + 0.55, HERO + 0.9), 1.8);
    set($("#hero .k"), k * ctaOut);
    set($("#hero .n"), clamp(n * 1.4) * ctaOut, `scale(${lerp(.85, 1, n)})`);
    set($("#hero .g"), clamp(g * 1.4) * ctaOut, `scale(${lerp(.5, 1, g)})`);
    $("#flash").style.opacity = t >= HERO ? Math.max(0, 1 - (t - HERO) / 0.18) * 0.5 : 0;
  }
  // CTA
  {
    const T = CTA_START, on = t >= T - 0.25; vis($("#cta"), on);
    $("#cta").style.opacity = easeInOut(prog(t, T - 0.25, T + 0.1));
    const lg = easeOutBack(prog(t, T + 0.1, T + 0.6), 1.2);
    set($("#ctaLogo"), clamp(lg * 1.3), `translateY(${lerp(-50, 0, lg)}px) scale(${lerp(.9, 1, lg)})`);
    const r = easeOutExpo(prog(t, T + 0.5, T + 0.9)); set($("#ctaRule"), r, `scaleX(${r})`);
    set($("#ctaK"), easeOutCubic(prog(t, T + 0.6, T + 0.9)));
    document.querySelectorAll("#ctaMsg .l").forEach((l, i) => {
      const x = easeOutCubic(prog(t, T + 0.8 + i * 0.18, T + 1.25 + i * 0.18)); set(l, x, `translateY(${lerp(40, 0, x)}px)`);
    });
  }
  await w;
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))])
  .then(() => document.fonts.load('900 100px "ID"')).then(() => render(0));
</script>
</body>
</html>
